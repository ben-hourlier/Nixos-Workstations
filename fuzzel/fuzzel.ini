include=~/.config/fuzzel/theme.ini

[main]
font=JetBrainsMono NF:weight=bold:size=12
dpi-aware=no

show-icons=yes
icon-theme=Papirus

layer=overlay
exit-on-keyboard-focus-loss=no

width=30
lines=5
line-height=20

horizontal-pad=20
vertical-pad=10
inner-pad=10

terminal=kitty -e {cmd}

[border]
width=2
radius=7
