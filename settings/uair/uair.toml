loop_on_end = true

[defaults]
format = "{name} {time}\n"

# -- WORK SESSION --
[[sessions]]
id = "work"
name = "Work:"
duration = "60m"
command = "sh -c 'notify-send --category=\"system_alert\" \"Deepwork session over\" \"Time for a break.\" && pw-play $HOME/.config/deepwork-alarm.mp3 && timew stop'"
paused_state_text = "work-paused"
resumed_state_text = "work-resumed"
time_format = "%*-Hh%Mm"

# -- BREAK --
[[sessions]]
id = "break"
name = "Break:"
duration = "10m"
command = "sh -c 'notify-send --category=\"system_alert\" \"Break over\" \"Prepare a new session for deepwork.\" && pw-play $HOME/.config/deepwork-alarm.mp3'"
paused_state_text = "break-paused"
resumed_state_text = "break-resumed"
time_format = "%*-Hh%Mm"
