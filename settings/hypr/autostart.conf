# --- Autostart ---

# Initializes core Hyprland daemons on startup.
exec-once = hyprpaper
exec-once = hypridle
exec-once = theme-switch set
exec-once = set-config-media
exec-once = uair &
# Workspace overview and per-workspace stage manager.
exec-once = workspace-manager

# --- Background Services ---

# Stores clipboard history continuously in the background.
exec-once = wl-paste --type text --watch cliphist store