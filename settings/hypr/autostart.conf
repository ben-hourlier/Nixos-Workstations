# --- Autostart ---

# Initializes core Hyprland daemons on startup.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE DISPLAY && systemctl --user start hyprland-session.target
exec-once = hyprpaper
exec-once = hypridle
exec-once = theme-switch set
exec-once = set-config-media
exec-once = uair &
# Workspace overview and per-workspace stage manager.
exec-once = workspace-manager
# Screenshots, screen recording and text capture.
exec-once = capture daemon
