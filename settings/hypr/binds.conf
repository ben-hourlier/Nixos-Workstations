# --- Keybindings Configuration (AZERTY) ---

# --- General Window Management ---
bind = $mainMod, Q, killactive
bind = $mainMod, T, exec, $theme
bind = $mainMod, O, togglefloating, 
bind = $mainMod, P, pseudo,
bind = $mainMod, S, togglesplit, 
bind = $mainMod, F, fullscreen, 
# Expands the window to full screen without hiding the bar.
bind = $mainMod, M, fullscreen, 1 

# --- Application Launchers ---
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, TAB, exec, workspace-manager overview toggle

# --- Stage Manager ---
# Toggles stage mode on the focused workspace: one window on stage, the others in the side strip.
bind = $mainMod, G, exec, workspace-manager stage toggle
# Swaps with the last used window of the strip.
bind = $mainMod, A, exec, workspace-manager stage recent
# Rotates through every window of the strip.
bind = $mainMod SHIFT, A, exec, workspace-manager stage next

# --- Language ---
bind = mod5, F, exec, hyprctl switchxkblayout all 0
bind = mod5, R, exec, hyprctl switchxkblayout all 1
bind = mod5, A, exec, hyprctl switchxkblayout all 2

# --- Clipboard & Screenshots ---
# Copies the selected item of the clipboard history (Quickshell launcher).
bind = SUPER, V, exec, qs ipc call launcher clipboard

# Freezes the screens: click a window, drag an area, F for the whole screen,
# T to select text.
bind = SUPER SHIFT, S, exec, capture
bind = , Print, exec, capture

# Captures the entire output of the current monitor.
bind = SUPER CONTROL, S, exec, capture screen

# Copies the text (or QR code) of an area or a window.
bind = SUPER SHIFT, T, exec, capture text

# Starts or stops recording the current monitor.
bind = SUPER SHIFT, R, exec, capture record
bind = SUPER SHIFT, C, exec, hyprpicker -a;

bind = $mainMod, D, exec, whisper-dictate 

# --- Window Focus (Vim-style) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Window Movement (Vim-style) ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# --- Mouse Bindings ---
# Moves or resizes floating/tiled windows using the mouse.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Workspace Navigation (French Layout) ---
bind = $mainMod, ampersand, workspace, 1  
bind = $mainMod, eacute, workspace, 2     
bind = $mainMod, quotedbl, workspace, 3   
bind = $mainMod, apostrophe, workspace, 4 
bind = $mainMod, parenleft, workspace, 5  
bind = $mainMod, minus, workspace, 6      
bind = $mainMod, egrave, workspace, 7     
bind = $mainMod, underscore, workspace, 8 
bind = $mainMod, ccedilla, workspace, 9   
bind = $mainMod, agrave, workspace, 10    

# --- Workspace Window Movement (French Layout) ---
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# --- Media & Audio Controls ---
# Adjusts the global audio volume and mute state.
# Goes through Quickshell, which snaps the volume to multiples of 5.
bindel = , XF86AudioRaiseVolume, exec, qs ipc call audio up
bindel = , XF86AudioLowerVolume, exec, qs ipc call audio down
bindl = , XF86AudioMute, exec, qs ipc call audio mute

# Controls media playback across all compatible MPRIS players.
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# --- Hardware Backlight Controls ---
# Utilizes the newly created 'brightness' Nix package instead of a hardcoded path.
bind = , XF86MonBrightnessUp, exec, brightness up
bind = , XF86MonBrightnessDown, exec, brightness down