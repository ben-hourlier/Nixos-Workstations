# --- Theme Import ---
$wallpaper_path = ~/.config/hypr/current_wallpaper.png

# Imports external color variables and theme settings.
# This allows the lock screen colors to change dynamically when switching themes.
source = ~/.config/hypr/hyprlock-theme.conf


# --- General Settings ---

general {
    # Prevents triggering authentication failures when pressing Enter on an empty field.
    ignore_empty_input = true
    
    # Hides the mouse cursor on the lock screen for a cleaner look.
    hide_cursor = true
    
    # Sets the delay (in milliseconds) before the fail message disappears.
    fail_timeout = 1000
}

animations {
    # Disables animations for instant locking and unlocking.
    enabled = false
}


# --- Background ---

background {
    # Uses the dynamic wallpaper path defined in the imported theme file.
    path = $wallpaper_path
}


# --- Input Field ---

# Configures the password input field.
input-field {
    size = 180, 25
    outline_thickness = 0
    
    # Applies dynamic colors from the imported theme.
    inner_color = $inner_color
    font_color = $text_color
    check_color = $fail_color
    fail_color = $fail_color

    # Leaves placeholder and failure texts blank for a minimalist aesthetic.
    placeholder_text = 
    fail_text = 
    
    # Keeps the input field persistently visible.
    fade_on_empty = false
    rounding = 13
    
    # Positions the field slightly below the center of the screen.
    position = 0, -450
    halign = center
    valign = center
}


# --- Labels (Clock & Date) ---

# Displays the current time.
label {
    text = $TIME
    color = $text_color
    font_size = 60
    font_family = cantarell bold
    
    position = 0, 400
    halign = center
    valign = center
}

# Displays the current date.
label {
    # Leaves the monitor blank to display on all screens.
    monitor =
    
    # Uses a shell command to fetch and format the current date, updating every 1000ms.
    text = cmd[update:1000] echo "$(date +"%A %d %B")"
    color = $text_color
    font_size = 20
    font_family = cantarell
    
    position = 0, 450
    halign = center
    valign = center
}