# --- Main Variables ---

# Defines global variables for commonly used applications and modifiers.
# This makes it easy to swap out core programs without editing the keybindings file.
$mainMod = SUPER
$terminal = kitty 
$fileManager = $terminal -e yazi
$menu = fuzzel
$theme = theme-switch


# --- Configuration Modules ---

# Imports separated configuration files to keep the setup modular and maintainable.
# Note: The order is important. Monitors and workspaces should be loaded first.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/settings.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/autostart.conf


# --- Hardware Cursor ---

cursor {
    # Disables hardware cursors.
    # This is often required for NVIDIA GPUs on Wayland to prevent the mouse cursor 
    # from disappearing or rendering incorrectly.
    no_hardware_cursors = true
}