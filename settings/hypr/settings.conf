# --- Appearance & General Behavior ---

general {
    # Configures the spacing around and between windows.
    gaps_in = 3        
    gaps_out = 5       
    
    border_size = 2
    
    # Applies dynamic border colors. 
    # Note: These variables must be defined in the theme configuration file.
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    # Uses the default Dwindle layout algorithm for dynamic tiling.
    layout = dwindle

    # Disables screen tearing to prevent visual artifacts.
    allow_tearing = false
}

decoration {
    # Applies rounded corners to all window borders.
    rounding = 7

    active_opacity = 1.0
    inactive_opacity = 1.0
    
    # Disables blur and shadows to maximize performance and maintain a minimal aesthetic.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true

    # Defines a custom bezier curve for smooth, snappy animations.
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # Maps animation types to specific curves and durations.
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    
    # Ensures rapid and clean workspace transitions.
    animation = workspaces, 1, 3, default    
}

dwindle {
    # Allows pseudo-tiling, enabling windows to retain their floating size while tiled.
    pseudotile = true 
    
    # Prevents automatic layout adjustments from destroying split ratios.
    preserve_split = true
}

misc {
    # Keeps the environment minimalist by disabling default Hyprland branding elements.
    disable_hyprland_logo = true  
    disable_splash_rendering = true
    force_default_wallpaper = 0 

    # Lets a restarted Quickshell take the lock back if it died while locked,
    # instead of leaving the "lock screen app died" screen.
    allow_session_lock_restore = true
}
