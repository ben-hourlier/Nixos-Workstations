# --- Wallpaper Configuration ---

wallpaper {
    # Leaving the monitor value empty applies this wallpaper to all connected displays.
    monitor = 
    
    # Points to a symlinked file that is dynamically updated by the theme-switch script.
    path = ~/.config/hypr/current_wallpaper.png
}


# --- Misc ---

# Disables the default Hyprland splash text at the bottom of the screen.
splash = false