# --- General Idle Configuration ---

# No idle listener: an unlocked session never locks or blanks on its own.
# The Quickshell lock screen switches the screens off 10 seconds after the
# last key press or pointer motion on it.

general {
    # Locks through Quickshell; hyprlock only stands in if Quickshell is down.
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock

    # Ensures the session is locked right before the system goes to sleep/suspend.
    before_sleep_cmd = loginctl lock-session

    # Wakes the screens after resume; the lock screen blanks them again if idle.
    after_sleep_cmd = hyprctl dispatch dpms on
}
