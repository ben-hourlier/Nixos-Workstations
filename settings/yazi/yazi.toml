# --- Openers ---

[opener]
open = [
    { run = 'handlr open "$@"', orphan = true, desc = "Open with handlr", for = "unix" },
]

execute = [
    { run = "$@", orphan = true, desc = "Launch", for = "unix" }
]

edit = [
    { run = 'nvim "$@"', desc = "Nvim", block = true, for = "unix" },
    { run = 'code "$@"', desc = "VSCode", block = true, for = "unix" }
]

sudo-edit = [
    # Allows editing a temporary copy (/tmp or /var/tmp) that safely replaces 
    # the original file only if changes are successfully saved.
    { run = 'VISUAL=nvim EDITOR=nvim sudo -e "$@"', block = true, desc = "Nvim sudo-edit" }
]


# --- Opening Rules ---

[[open.prepend_rules]]
mime = "application/executable"
use = ["execute", "edit"]

[[open.prepend_rules]]
mime = "application/pie-executable"
use = ["execute", "edit"]

[[open.prepend_rules]]
mime = "text/shellscript"
use = ["execute", "edit"]

[[open.prepend_rules]]
url = "*"
use  = [ "open", "edit", "sudo-edit"]


# --- Plugin Fetchers ---

[[plugin.prepend_fetchers]]
id  = "git"
url = "*" 
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/" 
run = "git"