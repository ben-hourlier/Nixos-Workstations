<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Subtle dark Rosé Pine background surface with smooth rounded corners -->
  <rect width="128" height="128" rx="28" fill="#1f1d2e"/>
  
  <!-- Outer Focus Ring (Rosé Pine Rose: #ebbcba) -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#ebbcba" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Inner Focus Ring (Rosé Pine Foam: #9ccfd8) -->
  <circle cx="64" cy="64" r="24" fill="none" stroke="#9ccfd8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Central Target Point (Rosé Pine Love: #eb6f92) -->
  <circle cx="64" cy="64" r="7" fill="#eb6f92"/>
</svg>
