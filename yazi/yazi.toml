[opener]
open = [
    { run = 'xdg-open "$@"', orphan = true, desc = "Open with xdg", for = "unix" },
]

execute = [
    { run = "$@", orphan = true, desc = "Launch", for = "unix" }
]

edit = [
    { run = 'nvim "$@"', desc = "Nvim", block = true, for = "unix" },
    { run = 'code "$@"', desc = "VSCode", block = true, for = "unix" }
]

sudo-edit = [
    # sudo-edit allows to work on a copy (/tmp or /var/tmp) that will replace the original only in case of changes
    { run = 'VISUAL=nvim EDITOR=nvim sudo -e "$@"', block = true, desc = "Nvim sudo-edit" }
]

[[open.prepend_rules]]
mime = "application/executable"
use = ["execute", "edit"]

[[open.prepend_rules]]
mime = "application/pie-executable"
use = ["execute", "edit"]

[[open.prepend_rules]]
mime = "text/shellscript"
use = ["execute", "edit"]

[[open.prepend_rules]]
url = "*"
use  = [ "open", "edit", "sudo-edit"]

[[plugin.prepend_fetchers]]
id  = "git"
url = "*" 
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/" 
run = "git"