# --- Input Configuration ---

input {
    # Configures a dual-layout keyboard (French & Russian).
    kb_layout = fr,ru
    
    # Enables NumLock by default upon starting the graphical session.
    numlock_by_default = true
    
    # Automatically focuses the window located directly under the mouse cursor.
    follow_mouse = 1

    # Uses XKB to toggle between keyboard layouts via Alt+Shift, 
    # and sets the Right Control key as the Compose key.
    kb_options = grp:alt_shift_toggle, compose:rctrl

    # Touchpad specific settings.
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }

    # Applies raw mouse input without software acceleration (ideal for gaming).
    sensitivity = 0
}

misc {
    # Wakes up monitors from DPMS (sleep mode) upon detecting mouse movement or key presses.
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# --- Gestures ---

# Configures a 3-finger horizontal swipe on the touchpad to switch workspaces.
gesture = 3, horizontal, workspace