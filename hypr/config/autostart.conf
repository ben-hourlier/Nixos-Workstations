# =======================================================================================
#  AUTOSTART
# =======================================================================================

# hyprland programs
exec-once = hyprpaper
exec-once = hypridle

# Écoute les branchements/débranchements d'écrans pour relancer Waybar
exec-once = monitor-hotplug
exec-once = launch-waybar

# programs
exec-once = wl-paste --type text --watch cliphist store # clipboard history
exec-once = /opt/KopiaUI/kopia-ui

# scripts
exec-once = ~/bin/autoclose.sh # standby when lock