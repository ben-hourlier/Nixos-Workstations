# =======================================================================================
#  HYPRIDLE
# =======================================================================================

general {
    # Commande pour verrouiller (ne lance pas si déjà lancé)
    lock_cmd = pidof hyprlock || hyprlock
    
    # Verrouille avant de mettre en veille le système (suspend)
    before_sleep_cmd = loginctl lock-session
    
}

# LISTENER SPÉCIAL : Éteindre l'écran SI verrouillé
listener {
    timeout = 10
    
    # C'est ici que la magie opère :
    # "pidof hyprlock" renvoie Vrai si le verrouillage est actif.
    # "&&" exécute la suite seulement si c'est Vrai.
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    
    # Rallume l'écran dès qu'on bouge la souris (reprend l'activité)
    on-resume = hyprctl dispatch dpms on
}
