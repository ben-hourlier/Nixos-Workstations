# --- General Idle Configuration ---

general {
    # Defines the primary command used to lock the session.
    # The 'pidof' check prevents launching multiple instances of hyprlock simultaneously.
    lock_cmd = pidof hyprlock || hyprlock
    
    # Ensures the session is locked right before the system goes to sleep/suspend.
    before_sleep_cmd = loginctl lock-session
}


# --- Idle Listeners ---

# Creates a specific listener that turns off the display strictly if the system is already locked.
listener {
    # Sets the timeout duration in seconds (10 seconds after locking).
    timeout = 10
    
    # Evaluates if hyprlock is currently running. 
    # The '&&' ensures the screen is only turned off (dpms off) if the lock screen is active.
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    
    # Instantly wakes up the screens (dpms on) when user activity resumes (e.g., mouse movement).
    on-resume = hyprctl dispatch dpms on
}