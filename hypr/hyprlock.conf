# =======================================================================================
#  HYPRLOCK
# =======================================================================================
source = ~/.config/hypr/config/hyprlock-theme.conf

general {
    ignore_empty_input = true
    hide_cursor = true
    fail_timeout = 1000
}

animations {
    enabled = false
}


background {
    path = $wallpaper_path
}

input-field {
    size = 180, 25
    outline_thickness = 0
    
    inner_color = $inner_color
    font_color = $text_color

    check_color = $fail_color
    fail_color = $fail_color

    placeholder_text = 
    fail_text = 
    
    fade_on_empty = false
    rounding = 13
    
    position = 0, -450
    halign = center
    valign = center
}

label {
    text = $TIME
    color = $text_color
    font_size = 60
    font_family = cantarell bold
    
    position = 0, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A %d %B")"
    color = $text_color
    font_size = 20
    font_family = cantarell
    
    position = 0, 450
    halign = center
    valign = center
}